<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <!-- CSP kuralı scriptlerin çalışmasına izin verecek şekilde güncellendi -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' local:;"
        />
        <title>Markdown Okuyucu</title>
        <style>
            :root {
                --bg: #1e1e2e;
                --card-bg: #181825;
                --text: #cdd6f4;
                --subtext: #a6adc8;
                --heading: #89b4fa;
                --accent: #a6e3a1;
                --code-bg: #313244;
                --border: #45475a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
                background-color: var(--bg);
                color: var(--text);
                font-family:
                    "Lexend",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                font-size: 18px;
                line-height: 1.85;
                overflow-y: overlay;
            }

            header {
                position: sticky;
                top: 0;
                background: rgba(24, 24, 37, 0.95);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid var(--border);
                padding: 12px 24px;
                display: flex;
                align-items: center;
                gap: 16px;
                z-index: 100;
            }

            button {
                background-color: var(--heading);
                color: var(--card-bg);
                border: none;
                padding: 8px 18px;
                border-radius: 6px;
                font-family: "Lexend", sans-serif;
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                transition: opacity 0.2s;
            }
            button:hover {
                opacity: 0.9;
            }

            #file-name {
                font-size: 14px;
                color: var(--subtext);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #content-container {
                max-width: 760px;
                margin: 0 auto;
                padding: 40px 24px 120px 24px;
            }

            h1,
            h2,
            h3,
            h4 {
                color: var(--heading);
                margin-top: 1.8em;
                margin-bottom: 0.6em;
                line-height: 1.3;
                font-weight: 600;
            }
            h1 {
                border-bottom: 1px solid var(--border);
                padding-bottom: 8px;
            }
            p {
                margin-bottom: 1.5em;
            }
            ul,
            ol {
                padding-left: 24px;
                margin-bottom: 1.5em;
            }
            li {
                margin-bottom: 0.6em;
            }

            pre {
                background-color: var(--code-bg);
                padding: 16px;
                border-radius: 8px;
                overflow-x: auto;
                font-size: 15px;
                line-height: 1.5;
            }
            code {
                background-color: var(--code-bg);
                padding: 3px 6px;
                border-radius: 4px;
                font-family: monospace;
            }
            blockquote {
                border-left: 4px solid var(--accent);
                margin-left: 0;
                padding-left: 16px;
                color: #bac2de;
                font-style: italic;
            }

            #placeholder {
                text-align: center;
                margin-top: 120px;
                color: #6c7086;
            }

            .drag-over {
                outline: 2px dashed var(--accent);
                outline-offset: -10px;
            }
        </style>
    </head>
    <body>
        <header>
            <button id="open-btn">📂 Dosya Aç</button>
            <span id="file-name"
                >Dosyayı butondan seçebilir veya doğrudan pencereye
                sürükleyebilirsiniz.</span
            >
        </header>

        <main id="content-container">
            <div id="placeholder">
                <h2>📖 Okumak için bir Markdown dosyası seçin</h2>
                <p>Lexend fontu ve Catppuccin temasıyla rahatça okuyun.</p>
            </div>
            <div id="markdown-body"></div>
        </main>

        <script>
            const placeholder = document.getElementById("placeholder");
            const fileName = document.getElementById("file-name");
            const markdownBody = document.getElementById("markdown-body");
            const openBtn = document.getElementById("open-btn");

            function displayContent(html, name) {
                placeholder.style.display = "none";
                fileName.innerText = name;
                markdownBody.innerHTML = html;
                window.scrollTo(0, 0);
            }

            // Dosya Seçme Butonu
            openBtn.addEventListener("click", async () => {
                try {
                    if (!window.electronAPI) {
                        alert(
                            "Preload köprüsü yüklenemedi. Lütfen uygulamayı yeniden başlatın.",
                        );
                        return;
                    }
                    const result = await window.electronAPI.openFile();
                    if (result && result.html) {
                        displayContent(result.html, result.name);
                    }
                } catch (err) {
                    console.error("Dosya açılırken hata:", err);
                }
            });

            // Sürükle ve Bırak
            window.addEventListener("dragover", (e) => {
                e.preventDefault();
                document.body.classList.add("drag-over");
            });

            window.addEventListener("dragleave", () => {
                document.body.classList.remove("drag-over");
            });

            window.addEventListener("drop", async (e) => {
                e.preventDefault();
                document.body.classList.remove("drag-over");

                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    const text = await file.text();
                    const html = await window.electronAPI.parseMarkdown(text);
                    displayContent(html, file.name);
                }
            });
        </script>
    </body>
</html>
